name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装（运行时零依赖，只装测试用的 pytest）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 零第三方依赖自检
        run: python -c "import legalrag,sys; print('legalrag', legalrag.__version__, '| 已加载的第三方库:', [m for m in ('numpy','jieba','rank_bm25','sentence_transformers','fastapi','flask','openai') if m in sys.modules] or 'none')"

      - name: 单元测试
        run: python -m pytest tests -q

      - name: 建索引
        run: python -m legalrag build --db build-test.db

      - name: 检索与问答冒烟（拒答路径必须真的拒答）
        shell: bash
        run: |
          set -e
          python -m legalrag ask "预付款是多少？" | tee ask1.txt
          grep -q "回答" ask1.txt
          python -m legalrag ask "合同里写了每年有多少天带薪年假吗？" | tee ask2.txt
          grep -q "拒答" ask2.txt
          python -m legalrag search "违约金" -k 3 | tee search.txt
          grep -q "置信度" search.txt

      - name: 评测基线回归（效果被改坏必须让 CI 红）
        run: python -m legalrag eval --calibrate --out reports/eval_report.json

      - name: 评测门槛校验
        shell: bash          # Windows runner 默认是 PowerShell，heredoc 只有 bash 认
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("reports/eval_report.json")
          if not p.exists():
              sys.exit("没有生成评测报告")
          data = json.loads(p.read_text(encoding="utf-8"))
          recall = data.get("recall@k") or 0.0
          hit = data.get("hit@k") or 0.0
          refusal = (data.get("refusal") or {}).get("accuracy") or 0.0
          over = (data.get("refusal") or {}).get("over_refusals", 0)
          print("recall@k=%.4f hit@k=%.4f 拒答准确率=%.4f 误拒=%d" % (recall, hit, refusal, over))
          # 门槛定在"略低于当前实测值"：既能拦住效果明显退化，又不会因为一点抖动就红
          problems = []
          if recall < 0.75:
              problems.append("recall@k 低于 0.75")
          if hit < 0.85:
              problems.append("hit@k 低于 0.85")
          if refusal < 0.85:
              problems.append("拒答准确率低于 0.85")
          if over > 2:
              problems.append("误拒超过 2 道")
          if problems:
              sys.exit("评测基线回归：" + "；".join(problems))
          print("评测基线通过")
          PY

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: warn

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语法编译检查
        run: python -m compileall -q legalrag tests

      - name: 前端语法检查（零依赖单页，不允许任何 CDN）
        run: |
          node --check web/app.js
          if grep -Eq "https?://[^\"']*(cdn|unpkg|jsdelivr|googleapis)" web/index.html web/app.js; then
            echo "前端不允许引用外部 CDN"; exit 1
          fi
          echo "前端检查通过"

      - name: 静态资源防路径穿越自检
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from legalrag.server import Handler
          Handler.web_root = os.path.abspath("web")
          # 直接按 server 里的实现验一遍：realpath 后必须仍在 web_root 之内
          import urllib.parse
          root = os.path.realpath(Handler.web_root)
          for attack in ("/../legalrag/api.py", "/../../etc/passwd", "/..%2flegalrag/api.py"):
              # ⚠️ 必须**先 unquote 再 join** —— 服务端就是这么做的（`_serve_static` 里
              #    `urllib.parse.unquote(parsed.path)` 之后才 realpath + 前缀校验）。
              #    第一版自检忘了解码，于是 `%2f` 被当成普通字符、realpath 仍在 root 内，
              #    自检把自己判成失败（假阳性）。
              decoded = urllib.parse.unquote(attack)
              target = os.path.realpath(os.path.join(root, decoded.lstrip("/")))
              inside = target == root or target.startswith(root + os.sep)
              print("%-28s -> decoded=%-24s inside=%s" % (attack, decoded, inside))
              if inside and os.path.basename(target).endswith(".py"):
                  sys.exit("路径穿越检查失败：" + attack)
          print("路径穿越检查通过")
          PY

      - name: 依赖检查（运行时只允许标准库；测试只允许 pytest）
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          # legalrag/ 是发布出去的运行时，必须只用标准库；
          # tests/ 允许 pytest，但仍禁止偷偷引入向量库/分词库把测试喂饱。
          forbidden = {
              "numpy", "scipy", "pandas", "sklearn", "torch", "transformers",
              "jieba", "pkuseg", "hanlp", "snownlp", "rank_bm25", "whoosh",
              "faiss", "chromadb", "sentence_transformers", "openai", "anthropic",
              "requests", "httpx", "aiohttp", "flask", "fastapi", "django",
              "uvicorn", "pydantic", "yaml", "click", "typer", "rich", "tqdm",
          }
          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          base_allowed = stdlib | {"legalrag", "__future__"}

          def is_bad(root: str, is_test: bool) -> bool:
              if is_test and root in ("pytest", "conftest"):
                  return False
              if stdlib:                        # Python >= 3.10 有权威标准库名单
                  return root not in base_allowed
              return root in forbidden          # 旧解释器退化为禁止名单

          files = [(p, False) for p in sorted(pathlib.Path("legalrag").rglob("*.py"))]
          files += [(p, True) for p in sorted(pathlib.Path("tests").rglob("*.py"))]
          bad = []
          for path, is_test in files:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if is_bad(alias.name.split(".")[0], is_test):
                              bad.append(f"{path}: import {alias.name}")
                  elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      if is_bad(node.module.split(".")[0], is_test):
                          bad.append(f"{path}: from {node.module}")
          if bad:
              print("\n".join(bad))
              raise SystemExit("依赖检查未通过")
          print(f"依赖检查通过：运行时 {sum(1 for _, t in files if not t)} 个文件仅用标准库")
          PY

  e2e:
    name: 端到端冒烟（真起服务）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 起服务并打接口
        run: |
          set -e
          python -m legalrag serve --port 8137 --quiet &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8137/api/health >/dev/null; then break; fi
            sleep 1
          done
          echo "--- health ---"; curl -sf http://127.0.0.1:8137/api/health; echo
          echo "--- search ---"; curl -sf "http://127.0.0.1:8137/api/search?q=%E8%BF%9D%E7%BA%A6%E9%87%91&k=3" | head -c 300; echo
          echo "--- ask ---"
          curl -sf -X POST http://127.0.0.1:8137/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"预付款是多少？"}' | tee ask.json | head -c 300; echo
          python -c "import json;d=json.load(open('ask.json'));assert d['citations'], '没有引用';print('引用条款:', [c['number'] for c in d['citations']])"
          echo "--- 拒答 ---"
          curl -sf -X POST http://127.0.0.1:8137/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"合同里写了每年有多少天带薪年假吗？"}' | python -c "import json,sys;d=json.load(sys.stdin);print('refused =', d['refused'])"
          echo "--- 前端 ---"; curl -sf http://127.0.0.1:8137/ | head -c 120; echo
          echo "--- 路径穿越必须 403 ---"
          # 注意 --path-as-is：不加的话 curl 会自己把 .. 规范化掉，测不到服务端的防护
          code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:8137/../legalrag/api.py')
          echo "traversal(越界读取源码) status=$code"
          test "$code" = "403"
          # 反向确认：越界到存在的文件时必须 404/403 而**不能**是 200
          leak=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:8137/../README.md')
          echo "traversal(读到仓库根文件) status=$leak"
          test "$leak" != "200"
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true

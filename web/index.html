<!DOCTYPE html>
<!--
  法律合同 RAG 检索助手 —— 单页前端
  设计约定：
  1. 纯静态、零第三方依赖（无 CDN / 无字体 / 无图标库），可被后端静态托管，也可直接双击打开。
  2. 页面骨架写在 HTML 里，JS 只负责填充动态区域；因此即使 app.js 加载失败也不会白屏，
     用户仍能看到标题、说明和"脚本未加载"的提示。
  3. 所有动态文本一律通过 textContent 或转义函数写入（详见 app.js 的 escapeHtml / renderHighlight）。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="法律合同条款检索与风险问答系统前端：条款检索、RAG 问答、引用溯源与风险提示。">
  <title>法律合同 RAG 检索助手</title>
  <!-- 空 favicon：避免浏览器自动请求 /favicon.ico 时在控制台留下 404 噪音（不引入任何外部资源） -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- defer：不阻塞解析，且保证脚本执行时 DOM 已就绪（无需 DOMContentLoaded 包裹） -->
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#query">跳到查询输入框</a>

  <!-- ============================ 顶部：标题 + 后端状态 ============================ -->
  <header class="app-header">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">§</span>
      <div class="brand__text">
        <h1 class="brand__title">法律合同 RAG 检索助手</h1>
        <p class="brand__desc">面向合同条款的检索增强问答：先定位条款原文，再给出带引用与风险提示的回答。</p>
      </div>
    </div>

    <!-- 状态指示灯：绿=正常（显示条款/合同数），红=不可用（显示重试按钮） -->
    <div class="status" id="status" data-state="loading" role="status" aria-live="polite">
      <span class="status__dot" aria-hidden="true"></span>
      <span class="status__text" id="status-text">正在检测后端服务…</span>
      <button type="button" class="btn btn--ghost btn--sm" id="status-retry" hidden>重试</button>
    </div>
  </header>

  <!-- ============================ 主体：≥1000px 两栏，窄屏单栏 ============================ -->
  <main class="layout">
    <!-- 左栏：查询面板 + 结果列表 -->
    <section class="column column--left" aria-label="查询与结果">
      <form class="panel query-panel" id="query-form" autocomplete="off" novalidate>
        <!-- 模式切换：检索条款（GET /api/search） / 提问 RAG（POST /api/ask） -->
        <div class="tabs" role="tablist" aria-label="查询模式">
          <button type="button" class="tab is-active" role="tab" aria-selected="true"
                  id="tab-search" data-mode="search">检索条款</button>
          <button type="button" class="tab" role="tab" aria-selected="false"
                  id="tab-ask" data-mode="ask">提问（RAG）</button>
        </div>

        <div class="field">
          <label class="field__label" id="query-label" for="query">关键词 / 条款描述</label>
          <input class="input" id="query" name="q" type="search" enterkeyhint="search"
                 placeholder="例如：预付款比例、违约金、保密期限" aria-describedby="query-hint">
        </div>

        <div class="row">
          <div class="field field--grow">
            <label class="field__label" for="contract">合同范围</label>
            <select class="input" id="contract">
              <option value="">全部合同</option>
            </select>
          </div>
          <div class="field field--narrow">
            <label class="field__label" for="topk">返回条数</label>
            <select class="input" id="topk">
              <option value="5">5</option>
              <option value="8">8</option>
              <option value="10">10</option>
              <option value="15">15</option>
            </select>
          </div>
        </div>

        <div class="row row--actions">
          <button class="btn btn--primary" id="submit" type="submit">检索</button>
          <button class="btn btn--ghost" id="reset" type="button">清空</button>
          <span class="hint" id="query-hint">回车提交 · Esc 清空</span>
        </div>

        <p class="meta" id="query-meta" hidden></p>
      </form>

      <!-- 统一的错误横幅：网络异常 / 非 200 / JSON 解析失败都会走这里，并提供重试入口 -->
      <div class="banner" id="error-banner" role="alert" hidden>
        <span class="banner__icon" aria-hidden="true">!</span>
        <div class="banner__body">
          <p class="banner__title">请求失败</p>
          <p class="banner__text" id="error-text"></p>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" id="error-retry" hidden>重试</button>
      </div>

      <!-- 结果区：初始占位由 HTML 提供，避免脚本未就绪时出现空白 -->
      <div class="results" id="results" aria-live="polite">
        <div class="placeholder">
          <p class="placeholder__title">还没有结果</p>
          <p class="placeholder__text">选择「检索条款」按关键词查找条款，或选择「提问（RAG）」直接用自然语言提问。</p>
        </div>
      </div>
    </section>

    <!-- 右栏：条款详情（点击结果卡片后加载完整原文） -->
    <aside class="column column--right" aria-label="条款详情">
      <div class="panel detail" id="detail">
        <div class="placeholder">
          <p class="placeholder__title">条款详情</p>
          <p class="placeholder__text">点击左侧任意结果卡片，这里会显示该条款的完整原文、风险标签与来源信息。</p>
        </div>
      </div>
    </aside>
  </main>

  <!-- ============================ 底部：免责声明常驻可见 ============================ -->
  <footer class="app-footer">
    <span class="app-footer__label" aria-hidden="true">免责声明</span>
    <span class="app-footer__text" id="disclaimer">本结果由系统自动生成，仅供内部参考，不构成法律意见。</span>
  </footer>

  <!-- 轻量提示条：反馈提交结果、复制成功等 -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <div class="banner banner--static">
      <div class="banner__body">
        <p class="banner__title">当前浏览器已禁用 JavaScript</p>
        <p class="banner__text">本页面的检索与问答功能依赖 JavaScript，请启用后重新载入。</p>
      </div>
    </div>
  </noscript>
</body>
</html>
